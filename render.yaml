services:
  - type: web
    name: doggipos-multisede
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # PIN de arranque (6 a 12 dígitos). Solo se usan si la tabla de usuarios está vacía.
      - key: ADMIN_INITIAL_PIN
        sync: false
      - key: CAJERO1_INITIAL_PIN
        sync: false
      - key: CAJERO2_INITIAL_PIN
        sync: false
      # Google Drive: comprobantes de pago y facturas (mini script de Apps Script)
      - key: DRIVE_SCRIPT_URL
        sync: false
      - key: DRIVE_SCRIPT_TOKEN
        sync: false
      # Datos que salen en la factura digital
      - key: NEGOCIO_NOMBRE
        value: Family Burger
      - key: NEGOCIO_DESCRIPCION
        value: "Mira el menú, aparta tu pedido y paga desde tu teléfono."
      - key: NEGOCIO_RIF
        sync: false
      - key: NEGOCIO_TEL
        sync: false
      - key: NEGOCIO_DIRECCION
        sync: false
      - key: FACTURA_PREFIJO
        value: FB
      - key: PEDIDO_VENCE_MIN
        value: "15"
