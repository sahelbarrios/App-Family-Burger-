services:
  - type: web
    name: doggipos-multisede
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn server:app --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # PIN de arranque (6 a 12 dígitos). Solo se usan si la tabla de usuarios está vacía.
      - key: ADMIN_INITIAL_PIN
        sync: false
      - key: CAJERO1_INITIAL_PIN
        sync: false
      - key: CAJERO2_INITIAL_PIN
        sync: false
